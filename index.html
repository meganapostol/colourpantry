    <meta name="google-site-verification" content="REPLACE_WITH_GOOGLE_VERIFICATION_CODE" />

    <!-- JSON-LD structured data for the site -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Colour Pantry",
        "url": "https://colourpantry.com/",
        "description": "Free, no-account colour reference and palette tool with comprehensive skin tone library, hex lookup, accessibility testing, and palette generation.",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="preload" as="image" href="/loader/poster.webp" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('colour-pantry-theme');
          if (saved === 'dark') document.documentElement.classList.add('dark');
        } catch (_) {}
      })();
    </script>
    <style>
      #cp-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #faf7f2;
        transition: opacity 0.45s ease;
      }
      html.dark #cp-loader {
        background: #0e0e0e;
      }
      #cp-loader.cp-out {
        opacity: 0;
        pointer-events: none;
      }
      .cp-stage {
        position: relative;
        width: min(92vw, 620px);
        aspect-ratio: 16 / 9;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid #e8e2d5;
        background: #a5a4a2;
      }
      html.dark .cp-stage {
        border-color: #262626;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5), 0 8px 32px rgba(0, 0, 0, 0.4);
      }
      .cp-stage video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .cp-pct {
        position: absolute;
        left: 18px;
        bottom: 14px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        letter-spacing: 0.02em;
        color: #fff;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45);
      }
      .cp-mark {
        position: absolute;
        top: calc(50% + min(46vw, 310px) * 9 / 16 + 22px);
        left: 0;
        right: 0;
        text-align: center;
        font-family: Jost, 'Avant Garde', ui-sans-serif, system-ui, sans-serif;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: #7a7468;
      }
      html.dark .cp-mark {
        color: #9a9a9a;
      }
    </style>
  </head>
  <body>
    <div id="cp-loader" role="status" aria-label="Loading Colour Pantry">
      <div class="cp-stage" aria-hidden="true">
        <video id="cp-melt" muted playsinline preload="auto" poster="/loader/poster.webp">
          <source src="/loader/melt.webm" type="video/webm" />
          <source src="/loader/melt.mp4" type="video/mp4" />
        </video>
        <span class="cp-pct" id="cp-pct">0%</span>
      </div>
      <span class="cp-mark" aria-hidden="true">colour pantry</span>
    </div>
    <script>
      (function () {
        'use strict';
        var el = document.getElementById('cp-loader');
        var qs = new URLSearchParams(location.search);
        var mode = qs.get('melt'); // "off" kills the loader, "slow" fakes a slow boot
        window.__cpBootSettle = function () {};
        if (mode === 'off') {
          el.remove();
          return;
        }

        var v = document.getElementById('cp-melt');
        var pctOut = document.getElementById('cp-pct');
        var t0 = performance.now();
        var TASKS = { app: false, fonts: false, stash: false };
        var reduced =
          window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var shown = 0;
        var doneAt = 0;
        var gone = false;

        function progress() {
          var n = 0;
          var total = 0;
          for (var k in TASKS) {
            total++;
            if (TASKS[k]) n++;
          }
          return n / total;
        }

        window.__cpBootSettle = function (task) {
          if (mode !== 'slow' && task in TASKS) TASKS[task] = true;
        };

        if (mode === 'slow') {
          [['app', 1400], ['fonts', 3400], ['stash', 5600]].forEach(function (t) {
            setTimeout(function () {
              TASKS[t[0]] = true;
            }, t[1]);
          });
        } else if (document.fonts && document.fonts.load) {
          document.fonts
            .load('500 16px Jost')
            .catch(function () {})
            .then(function () {
              TASKS.fonts = true;
            });
        } else {
          TASKS.fonts = true;
        }

        // Never trap anyone behind the loader. The first watchdog settles the
        // tasks; the second force-fades even if rAF is frozen (hidden tab).
        setTimeout(function () {
          for (var k in TASKS) TASKS[k] = true;
        }, 8000);
        setTimeout(function () {
          fade();
        }, 15000);

        function fade() {
          if (gone) return;
          gone = true;
          try {
            v.pause();
          } catch (e) {}
          el.classList.add('cp-out');
          setTimeout(function () {
            el.remove();
          }, 500);
        }

        var last = 0;
        function frame(t) {
          if (gone) return;
          var dt = last ? Math.min(64, t - last) : 16;
          last = t;

          var target = progress();
          var diff = target - shown;
          if (Math.abs(diff) < 0.0005) shown = target;
          else shown += diff * (1 - Math.pow(0.0045, dt / 1000));

          pctOut.textContent = Math.round(shown * 100) + '%';

          var dur = isFinite(v.duration) && v.duration > 0 ? v.duration : 5;
          var want = Math.pow(shown, 2.2) * dur;

          if (!reduced) {
            var err = want - v.currentTime;
            if (err > 0.02) {
              if (v.paused) {
                var p = v.play();
                if (p && p.catch) p.catch(function () {});
              }
              try {
                v.playbackRate = Math.min(4, Math.max(0.25, err * 3));
              } catch (e) {}
            } else if (!v.paused) {
              v.pause();
            }
          }

          if (target >= 1 && shown > 0.995) {
            if (!doneAt) {
              doneAt = t;
              // Warm cache: everything settled almost instantly, skip the wax.
              if (t - t0 < 350) return fade();
              if (reduced) return void setTimeout(fade, 250);
            }
            if (v.currentTime >= dur - 0.08 || t - doneAt > 1400) return fade();
          }
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);

        window.__cpMelt = function () {
          return {
            tasks: { app: TASKS.app, fonts: TASKS.fonts, stash: TASKS.stash },
            shown: shown,
            gone: gone,
            reduced: reduced,
            time: v.currentTime,
            paused: v.paused,
          };
        };
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
