<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF7F2" />

    <title>Colour Pantry — every hex code in cubes</title>
    <meta name="description" content="A free, no-account colour reference and palette tool. Browse 24 hue families in OKLCH, lookup any hex for neighbours and accessibility, generate harmonies, and export to PNG, PDF, CSS, Tailwind, and more." />
    <meta name="keywords" content="colour palette, hex lookup, OKLCH, color tools, palette generator, accessibility, colour vision deficiency, WCAG contrast, brand colours, design tokens" />
    <meta name="author" content="Colour Pantry" />

    <link rel="canonical" href="https://colourpantry.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Colour Pantry" />
    <meta property="og:title" content="Colour Pantry — every hex code in cubes" />
    <meta property="og:description" content="Free, no-account colour reference and palette tool. Lookup any hex, browse hue families in OKLCH, test accessibility, and export anywhere." />
    <meta property="og:url" content="https://colourpantry.com/" />
    <meta property="og:image" content="https://colourpantry.com/favicon.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Colour Pantry — every hex code in cubes" />
    <meta name="twitter:description" content="Free, no-account colour reference and palette tool. Lookup any hex, browse hue families in OKLCH, test accessibility, and export anywhere." />
    <meta name="twitter:image" content="https://colourpantry.com/favicon.svg" />

    <!-- Google Search Console verification — replace REPLACE_WITH_GOOGLE_VERIFICATION_CODE
         with the value you get from search.google.com/search-console/welcome -->
    <meta name="google-site-verification" content="REPLACE_WITH_GOOGLE_VERIFICATION_CODE" />

    <!-- JSON-LD structured data for the site -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Colour Pantry",
        "url": "https://colourpantry.com/",
        "description": "Free, no-account colour reference and palette tool with comprehensive skin tone library, hex lookup, accessibility testing, and palette generation.",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('colour-pantry-theme');
          if (saved === 'dark') document.documentElement.classList.add('dark');
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
